name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Test and package Windows application
        shell: powershell
        run: .\scripts\build-windows.ps1
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: previewimages-windows-x64
          path: dist/previewimages-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
